<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Practice RPG</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect x=%223%22 y=%223%22 width=%2210%22 height=%2210%22 fill=%22none%22 stroke=%22%23e8b04a%22 stroke-width=%222%22/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <canvas id="game"></canvas>

    <div id="start" class="screen">
      <h1>Practice RPG</h1>
      <p class="sub">Two battles, one site.</p>
      <div class="modes">
        <button class="mode" data-mode="duel" disabled>
          <b>Duel</b>
          <span>One swordsman against his rival. Timed presses, a transformation, a cinematic.</span>
        </button>
        <button class="mode" data-mode="party" disabled>
          <b>Party</b>
          <span>Four heroes against skeletons. Speed decides who acts; auto battle on.</span>
        </button>
      </div>
      <p id="loading">Loading…</p>
    </div>

    <div id="duel-hud" class="hud" hidden>
      <div class="foe panel"><span class="name" id="rival-name"></span><div class="bar hp"><i id="rival-hp"></i></div></div>
      <div class="pending" id="duel-note" hidden></div>
      <div id="timing"></div>
      <div class="bottom">
        <div class="hero panel">
          <div class="row"><span class="name" id="hero-name"></span><span id="hero-dlv"></span></div>
          <div class="row"><span class="tag">HP</span><div class="bar hp"><i id="hero-hp"></i></div><span id="hero-hp-text"></span></div>
          <div class="row"><span class="tag">SP</span><div class="sp" id="hero-sp"></div></div>
        </div>
        <div class="menu" id="duel-menu"></div>
        <div class="pad" id="pad" hidden></div>
      </div>
    </div>

    <div id="party-hud" class="hud" hidden>
      <div id="plates"></div>
      <div id="floaters"></div>
      <div class="timeline panel" id="timeline"></div>
      <div class="controls"><button id="auto" class="on" disabled title="manual play comes in PLAN.md P3">Auto ON</button><button id="speed" disabled>1x</button></div>
      <div id="party-banner" class="banner" hidden></div>
      <div id="party-end" class="end panel" hidden><div id="party-result"></div><button id="again">Play again</button></div>
      <div class="bottom">
        <div class="sp-pool panel"><span class="tag">Skill points</span><div id="party-sp"></div></div>
        <div class="cards" id="cards"></div>
      </div>
    </div>

    <button id="back" hidden>‹ Modes</button>
    <div id="presses" class="panel" hidden><div id="fps" hidden></div><pre id="presses-log"></pre><button id="calibrate">Calibrate delay</button></div>
    <div id="calib" hidden><p>Tap (or press Space) each time the box flashes.</p><div id="calib-box"></div></div>
    <div id="credits">Characters: KayKit (CC0)</div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
