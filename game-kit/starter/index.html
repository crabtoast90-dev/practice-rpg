<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>New Game</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect x=%223%22 y=%223%22 width=%2210%22 height=%2210%22 fill=%22none%22 stroke=%22%23e8b04a%22 stroke-width=%222%22/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <canvas id="game"></canvas>

    <div id="start" class="screen">
      <h1>New Game</h1>
      <p class="sub">Starter project: replace this screen with yours.</p>
      <div class="modes">
        <button class="mode" data-mode="example" disabled>
          <b>Example</b>
          <span>A hero and a skeleton trade blows. A seeded fight the sim decides and the screen plays back.</span>
        </button>
      </div>
      <p id="loading">Loading…</p>
    </div>

    <div id="example-hud" class="hud" hidden>
      <div class="top">
        <div class="panel unit"><span class="name" id="hero-name"></span><div class="bar hp"><i id="hero-hp"></i></div><span id="hero-hp-text"></span></div>
        <div class="panel unit"><span class="name" id="foe-name"></span><div class="bar hp"><i id="foe-hp"></i></div><span id="foe-hp-text"></span></div>
      </div>
      <div id="example-end" class="end panel" hidden><div id="example-result"></div><button id="again">Play again</button></div>
    </div>

    <button id="back" hidden>‹ Modes</button>
    <div id="fps" class="panel" hidden></div>
    <div id="credits">Characters: KayKit (CC0)</div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
